<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="BridgeTalk — real-time sign language to text translation inside a video call."
    />
    <!-- Dark, so the meeting room does not flash white before React mounts. -->
    <meta name="theme-color" content="#202124" />
    <title>BridgeTalk</title>

    <!-- Fonts are SELF-HOSTED, loaded by src/index.css from npm packages.
         They used to come from Google's CDN, and that was Bug 5: on a cold
         cache the icon font took over two seconds to arrive — measured — and
         on a restricted or offline network it never arrived at all. Icon
         glyphs were then absent and body text fell back to the system sans,
         whose metrics differ, so text and icons read as misaligned.

         Self-hosting also removes the last runtime dependency on a third
         party, so the application now runs entirely offline after setup. -->
  </head>
  <body>
    <!-- React mounts here. The noscript message matters: this is an
         accessibility project, so a JavaScript-disabled visitor gets a real
         explanation rather than a blank page. -->
    <div id="root"></div>
    <noscript>
      BridgeTalk needs JavaScript to run hand tracking in your browser. Please
      enable JavaScript and reload this page.
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
